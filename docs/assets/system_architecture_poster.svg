<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 21px; fill: #475569; }
      .section-title { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .box-title { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .box-sub { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 17px; fill: #334155; }
      .small { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 15px; fill: #475569; }
      .tag { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .lane-text { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .mono { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 16px; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .main-card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; rx: 22; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .teal { fill: #ccfbf1; stroke: #0f766e; }
      .amber { fill: #fef3c7; stroke: #d97706; }
      .rose { fill: #ffe4e6; stroke: #e11d48; }
      .purple { fill: #ede9fe; stroke: #7c3aed; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .slate { fill: #e2e8f0; stroke: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-teal { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrow-teal); }
      .arrow-amber { fill: none; stroke: #d97706; stroke-width: 4; marker-end: url(#arrow-amber); }
      .arrow-rose { fill: none; stroke: #e11d48; stroke-width: 4; marker-end: url(#arrow-rose); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 3.5; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
      .pill { rx: 14; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>

  <text class="title" x="80" y="82">基於 Octree 與 Random Forest 的多樓層 3D 點雲導航系統架構</text>
  <text class="subtitle" x="82" y="120">Gazebo semantic point cloud -> Adaptive Octree -> RF semantic prediction -> Stair-aware A* -> Gazebo path visualization</text>

  <line class="divider" x1="80" y1="155" x2="1720" y2="155"/>

  <!-- Main vertical data flow -->
  <rect class="main-card blue" x="105" y="205" width="310" height="118"/>
  <text class="box-title" x="135" y="250">Gazebo Indoor World</text>
  <text class="box-sub" x="135" y="283">warehouse / predict world</text>
  <text class="small" x="135" y="307">collision geometry as data source</text>

  <path class="arrow-blue" d="M415 264 C470 264, 480 264, 535 264"/>
  <text class="small" x="442" y="245">collision geometry</text>

  <rect class="main-card teal" x="535" y="205" width="330" height="118"/>
  <text class="box-title" x="565" y="250">DynamicWorldCloud Plugin</text>
  <text class="box-sub" x="565" y="283">surface sampling by point_spacing</text>
  <text class="small" x="565" y="307">semantic labels from model/entity</text>

  <path class="arrow-teal" d="M865 264 C925 264, 940 264, 1000 264"/>
  <text class="mono" x="900" y="245">/world/dynamic_cloud</text>

  <rect class="main-card amber" x="1000" y="190" width="360" height="150"/>
  <text class="box-title" x="1030" y="235">PointCloudPacked Topic</text>
  <text class="mono" x="1030" y="268">xyz</text>
  <text class="mono" x="1095" y="268">label</text>
  <text class="mono" x="1175" y="268">obstacle_probability</text>
  <text class="mono" x="1030" y="299">entity_id</text>
  <text class="small" x="1030" y="324">Gazebo Transport streaming data</text>

  <path class="arrow-amber" d="M1360 264 C1415 264, 1430 264, 1485 264"/>

  <rect class="main-card slate" x="1485" y="205" width="245" height="118"/>
  <text class="box-title" x="1518" y="250">PointCloud Parser</text>
  <text class="box-sub" x="1518" y="283">decode fields</text>
  <text class="small" x="1518" y="307">PointCloudSample[]</text>

  <path class="arrow" d="M1607 323 C1607 370, 1607 392, 1607 438"/>

  <!-- Octree core -->
  <rect class="main-card" x="1095" y="438" width="510" height="280"/>
  <text class="section-title" x="1128" y="484">OctreeManager</text>
  <text class="subtitle" x="1128" y="516">Linear adaptive Octree for navigation leaves</text>

  <rect class="pill blue" x="1128" y="545" width="205" height="48"/>
  <text class="tag" x="1150" y="575">Adaptive Voxel Splitting</text>

  <rect class="pill green" x="1360" y="545" width="205" height="48"/>
  <text class="tag" x="1384" y="575">Leaf Geometry Features</text>

  <rect class="pill amber" x="1128" y="612" width="205" height="48"/>
  <text class="tag" x="1156" y="642">Normal / Density / PCA</text>

  <rect class="pill purple" x="1360" y="612" width="205" height="48"/>
  <text class="tag" x="1388" y="642">Neighbor Connectivity</text>

  <text class="small" x="1128" y="694">leaf voxel: center, size, density, avg_normal, eigen features, room / stair metadata</text>

  <!-- Feature export branch -->
  <path class="arrow-dashed" d="M1095 575 C1000 575, 985 575, 895 575"/>
  <rect class="main-card amber" x="575" y="512" width="320" height="128"/>
  <text class="box-title" x="605" y="556">Feature CSV Export</text>
  <text class="mono" x="605" y="590">data/train_leaf_features.csv</text>
  <text class="small" x="605" y="616">one row per leaf voxel</text>

  <path class="arrow-amber" d="M735 640 C735 690, 735 710, 735 760"/>
  <rect class="main-card rose" x="575" y="760" width="320" height="128"/>
  <text class="box-title" x="605" y="804">Python train_model.py</text>
  <text class="box-sub" x="605" y="837">Random Forest training</text>
  <text class="mono" x="605" y="865">models/*.rf.txt</text>

  <path class="arrow-rose" d="M895 824 C970 824, 1015 812, 1088 760"/>
  <text class="small" x="935" y="805">C++ readable model</text>

  <!-- RF prediction -->
  <path class="arrow" d="M1350 718 C1350 758, 1350 776, 1350 816"/>
  <rect class="main-card rose" x="1110" y="816" width="480" height="118"/>
  <text class="box-title" x="1140" y="860">Random Forest Model</text>
  <text class="box-sub" x="1140" y="893">predict leaf label / obstacle probability</text>
  <text class="small" x="1140" y="918">0 free, 1 obstacle, 2 stair</text>

  <path class="arrow-rose" d="M1350 934 C1350 970, 1350 986, 1350 1022"/>
  <rect class="main-card purple" x="1110" y="1022" width="480" height="92"/>
  <text class="box-title" x="1140" y="1060">RF Predicted Octree</text>
  <text class="box-sub" x="1140" y="1092">semantic leaf graph for navigation</text>

  <!-- A* and visualization -->
  <path class="arrow" d="M1110 1068 C1015 1068, 1000 1068, 905 1068"/>
  <rect class="main-card green" x="520" y="992" width="385" height="152"/>
  <text class="box-title" x="550" y="1036">A* Path Planner</text>
  <text class="box-sub" x="550" y="1069">weighted cost + hard constraints</text>
  <text class="small" x="550" y="1097">label cost, probability cost, stair / cross-floor</text>
  <text class="small" x="550" y="1122">floor-level exit constraint, vertical movement limit</text>

  <path class="arrow-teal" d="M520 1068 C420 1068, 400 1068, 300 1068"/>
  <rect class="main-card teal" x="80" y="1008" width="220" height="120"/>
  <text class="box-title" x="110" y="1052">Gazebo Path</text>
  <text class="box-sub" x="110" y="1085">visual-only cylinders</text>
  <text class="small" x="110" y="1110">cyan navigation line</text>

  <!-- Legend and process lanes -->
  <rect class="card" x="80" y="365" width="890" height="118"/>
  <text class="section-title" x="110" y="407">三個展示流程</text>
  <text class="lane-text" x="110" y="447">1. 資料產生</text>
  <text class="small" x="250" y="447">Gazebo -> DynamicWorldCloud -> /world/dynamic_cloud -> CSV</text>
  <text class="lane-text" x="110" y="476">2. 模型訓練</text>
  <text class="small" x="250" y="476">train CSV -> Random Forest -> .rf.txt -> C++ predictor</text>

  <rect class="card" x="80" y="505" width="430" height="246"/>
  <text class="section-title" x="110" y="548">Navigation Logic</text>
  <text class="small" x="110" y="584">A* cost function uses:</text>
  <text class="small" x="132" y="615">- Euclidean distance</text>
  <text class="small" x="132" y="644">- ML obstacle probability</text>
  <text class="small" x="132" y="673">- label-aware penalties</text>
  <text class="small" x="132" y="702">- stair / vertical movement constraints</text>
  <text class="small" x="132" y="731">- floor-level stair exit rules</text>

  <rect class="card" x="80" y="775" width="430" height="176"/>
  <text class="section-title" x="110" y="818">Poster Message</text>
  <text class="small" x="110" y="855">Octree compresses dense point clouds into navigation leaves.</text>
  <text class="small" x="110" y="884">RF adds semantic risk to each leaf.</text>
  <text class="small" x="110" y="913">A* uses risk and floor constraints for cross-floor paths.</text>

  <!-- Bottom annotations -->
  <rect class="slate" x="80" y="1160" width="1640" height="1"/>
  <text class="small" x="80" y="1185">Generated for navigation_project poster: Gazebo Transport topic /world/dynamic_cloud, adaptive Octree leaves, RF predicted labels, stair-aware A* path visualization.</text>
</svg>
